        selected: false
        code_language: python3
        code: |
          from datetime import datetime, timedelta, timezone


          def main() -> dict:
              now = datetime.now(timezone(timedelta(hours=8)))
              weekdays = ["一", "二", "三", "四", "五", "六", "日"]
              return {
                  "today": now.strftime("%Y年%m月%d日") + "，星期" + weekdays[now.weekday()],
